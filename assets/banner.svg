<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="super-repack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14183a"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gsi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <text x="64" y="132" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="2" fill="url(#title)" filter="url(#glow)">SUPER REPACK</text>
  <text x="68" y="182" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" fill="#cbd5e1">Troque o <tspan font-weight="700" fill="#ffffff">system</tspan> da super.img Samsung por uma GSI</text>
  <text x="68" y="222" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#94a3b8">extrair · converter · mapear · remontar · validar — direto no Termux</text>

  <!-- barra de particoes -->
  <g transform="translate(64,262)">
    <rect x="0" y="0" width="1152" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="420" height="40" rx="8" fill="url(#gsi)"/>
    <text x="216" y="33" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#052e16">system  ⇄  GSI</text>
    <rect x="432" y="6" width="58" height="40" rx="8" fill="#38bdf8"/>
    <rect x="496" y="6" width="320" height="40" rx="8" fill="#a78bfa"/>
    <rect x="822" y="6" width="40" height="40" rx="8" fill="#f472b6"/>
    <rect x="868" y="6" width="238" height="40" rx="8" fill="#fb923c"/>
    <rect x="1112" y="6" width="34" height="40" rx="8" fill="#facc15"/>
    <g font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="700" fill="#0b1020">
      <text x="461" y="32" text-anchor="middle">odm</text>
      <text x="656" y="32" text-anchor="middle">product</text>
      <text x="987" y="32" text-anchor="middle">vendor</text>
    </g>
  </g>

  <!-- selo de veredito -->
  <g transform="translate(940,70)" filter="url(#glow)">
    <rect x="0" y="0" width="276" height="64" rx="32" fill="#052e16" stroke="#22c55e" stroke-width="3"/>
    <text x="138" y="42" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="26" font-weight="800" fill="#4ade80">OK! Faça o Flash</text>
  </g>
</svg>
